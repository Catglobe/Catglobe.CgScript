name: Release Catglobe.ScriptDeployer NuPkg
on:
  workflow_dispatch:
  push:
    branches:
    - main
    - next
  pull_request:
    branches:
    - main
    - next

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
      checks: write
      issues: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10'
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Catglobe.CgScript.EditorSupport.CodeMirror.AspNet/package-lock.json
          node-version: 'lts/*'
      - name: Install dependencies
        run: npm clean-install
      - name: Clear stale test results
        shell: bash
        run: |
          rm -rf ./test-results-output
          rm -f ./Catglobe.CgScript.EditorSupport.Lsp.Tests/coverage.cobertura.xml
      - name: Test
        run: dotnet test --results-directory ./test-results-output --logger "trx;LogFileName=test-results.trx" -p:CollectCoverage=${{ !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
      - name: Detect unit-test failure
        id: unit-test-signal
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          failed=false
          if find ./test-results-output -maxdepth 1 -type f -name '*.trx' -print -quit 2>/dev/null | grep -q .; then
            if grep -Eiq '<UnitTestResult[^>]*outcome="Failed"' ./test-results-output/*.trx; then
              failed=true
            fi
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Archive test results
        if: ${{ always() && steps.unit-test-signal.outputs.failed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          path: ./test-results-output/*.trx
      - name: Preserve unit-test failure
        if: ${{ always() && steps.unit-test-signal.outputs.failed == 'true' }}
        run: exit 1
      - name: ReportGenerator
        if: ${{ always() && steps.unit-test-signal.outputs.failed != 'true' && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: ./test-results-output/**/*.cobertura.xml
          targetdir: ./coveragereport
          reporttypes: MarkdownAssembliesSummary
          verbosity: 'Info'
          sourcedirs: .
      - name: Ensure coverage report exists
        if: ${{ always() && steps.unit-test-signal.outputs.failed != 'true' && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        shell: bash
        run: |
          mkdir -p ./coveragereport
          touch ./coveragereport/Summary.md
      - name: Create check run with code coverage Markdown report
        if: ${{ always() && steps.unit-test-signal.outputs.failed != 'true' && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 📝 Code coverage
          conclusion: ${{ job.status }}
          output: '{"summary":"Summary of code coverage. See the GitHub Actions summary and this check run for details"}'
          output_text_description_file: ./coveragereport/Summary.md
      - name: Add Coverage output Summary
        if: ${{ always() && steps.unit-test-signal.outputs.failed != 'true' && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        shell: bash
        run: cat ./coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY
      - name: Add Coverage PR Comment
        if: ${{ always() && steps.unit-test-signal.outputs.failed != 'true' && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          path: ./coveragereport/Summary.md
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: Catglobe
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_TOKEN: ${{steps.nuget.outputs.NUGET_API_KEY}}

